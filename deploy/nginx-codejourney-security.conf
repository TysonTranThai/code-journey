# Code Journey — shared nginx rate-limit zones (installed at the http{} level
# as /etc/nginx/conf.d/codejourney-security.conf). Referenced by the
# codejourney.shop site config. See scripts/deploy-vps-nginx.sh.
#
# cj_auth: credential-stuffing guard on the NextAuth credentials callback.
#   10 r/IP/s sustained, burst 5 (nodelay) — enough for a family/classroom
#   behind one NAT to log in normally, hostile to rapid password spraying.
#   App-level per-IP limits (login 10/h + 5/min) remain in force behind this.
limit_req_zone $binary_remote_addr zone=cj_auth:1m rate=10r/s;

# cj_general: site-wide flood brake on DYNAMIC routes (30 r/IP/s, burst 60).
# Immutable static assets (/_next/static/) are exempt — they are cacheable and
# cheap. Brutes generic request floods before they reach the Node process.
# Sized for a whole classroom behind one NAT (burst of page loads at lesson
# start) while still capping single-IP floods.
limit_req_zone $binary_remote_addr zone=cj_general:1m rate=30r/s;
