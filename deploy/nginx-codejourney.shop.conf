# Code Journey — codejourney.shop (nginx reverse proxy, TLS via certbot)
# Upstream: the cj-prod compose stack's web container, bound to 127.0.0.1:3010.
# Install to: /etc/nginx/sites-available/codejourney.shop (+ symlink sites-enabled)
# Companion http-level zone file: deploy/nginx-codejourney-security.conf
#   (install to /etc/nginx/conf.d/codejourney-security.conf — see
#   scripts/deploy-vps-nginx.sh, which does both).

server {
    listen 80;
    listen [::]:80;
    server_name codejourney.shop www.codejourney.shop;

    # ACME challenge must be served over HTTP by certbot itself.
    location /.well-known/acme-challenge/ { }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www over HTTPS: terminate with the same cert, redirect to the apex.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.codejourney.shop;

    ssl_certificate     /etc/letsencrypt/live/codejourney.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codejourney.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://codejourney.shop$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name codejourney.shop;

    client_max_body_size 20M;

    # certbot injects certificate paths + modern TLS options here.
    ssl_certificate     /etc/letsencrypt/live/codejourney.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codejourney.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers duplicated at proxy level (app sets its own CSP).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Credential-stuffing guard (defense in depth): cheap nginx-level burst
    # limit on the NextAuth credentials callback (where login POSTs land),
    # before bcrypt CPU is spent. Zone declared in
    # /etc/nginx/conf.d/codejourney-security.conf.
    location = /api/auth/callback/credentials {
        limit_req zone=cj_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /_next/static/ {
        # Immutable build assets: exempt from rate limiting (cacheable, no
        # server-side computation per request).
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        # Site-wide flood brake (zone in conf.d/codejourney-security.conf).
        limit_req zone=cj_general burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        # SECURITY: OVERWRITE, never append, X-Forwarded-For. The app's rate
        # limiter trusts the FIRST XFF entry; appending would let any client
        # spoof a fresh IP per request and bypass every per-IP limit. Clients
        # connect directly to nginx (no CDN), so $remote_addr IS the client.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
