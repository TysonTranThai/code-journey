<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="cj-bg" x1="3" y1="3" x2="45" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0e1626" />
      <stop offset="100%" stopColor="#080d17" />
    </linearGradient>
    <linearGradient id="cj-grad-emerald" x1="4" y1="6" x2="28" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#4ade80" />
      <stop offset="50%" stopColor="#22c55e" />
      <stop offset="100%" stopColor="#06b6d4" />
    </linearGradient>
    <filter id="cj-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" floodColor="#22c55e" floodOpacity="0.7" />
    </filter>
  </defs>

  <!-- Container squircle with emerald border matching Logo.tsx container -->
  <rect x="3" y="3" width="42" height="42" rx="11" fill="url(#cj-bg)" stroke="#22c55e" stroke-opacity="0.45" stroke-width="1.8" />

  <!-- Centered Inner Monogram scaled to exact ~64% ratio of Logo.tsx -->
  <g transform="translate(24, 24) scale(0.92) translate(-15.5, -16)">
    <!-- Left code bracket flowing into 'C' -->
    <path
      d="M13 8L6.5 14.5C5.7 15.3 5.7 16.7 6.5 17.5L13 24"
      stroke="url(#cj-grad-emerald)"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#cj-glow)"
    />

    <!-- Dynamic journey trajectory slash connecting into 'J' curve -->
    <path
      d="M19 8L15.5 17.5C14.8 19.5 16 22 18.5 22H21C23.2 22 25 20.2 25 18V13.5"
      stroke="url(#cj-grad-emerald)"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Code dot pulse -->
    <circle cx="21" cy="9" r="2" fill="#38bdf8" />
  </g>

  <!-- Corner Radar Beacon with neon halo overlapping the corner -->
  <circle cx="41.5" cy="41.5" r="4.5" fill="#22c55e" fill-opacity="0.35" />
  <circle cx="41.5" cy="41.5" r="2.5" fill="#22c55e" />
  <circle cx="41.5" cy="41.5" r="1.0" fill="#a7f3d0" />
</svg>
